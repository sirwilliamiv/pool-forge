services:
  postgres:
    image: postgres:16-alpine
    container_name: poolforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pool
      POSTGRES_PASSWORD: pool
      POSTGRES_DB: poolforge
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pool -d poolforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
