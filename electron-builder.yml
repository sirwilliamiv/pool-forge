appId: com.poolforge.app
productName: Pool Forge
asar: true
directories:
  output: dist-electron
  buildResources: electron/build
files:
  - electron/**/*
  - package.json
  - "!**/.next/cache/**"
  # Built by `pnpm voice:build`; the maps are for local debugging only.
  - "!electron/voice/*.map"
extraResources:
  - from: .next/standalone
    to: standalone
  - from: .next/static
    to: standalone/.next/static
  - from: public
    to: standalone/public
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: "${productName}-${version}-${arch}.${ext}"
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    # Without this string macOS kills the app the first time it asks for the
    # microphone, rather than showing a prompt.
    NSMicrophoneUsageDescription: Pool Forge uses the microphone so you can design and price a pool by talking to it.
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: "${productName}-Setup-${version}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish: null
