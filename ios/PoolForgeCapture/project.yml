name: PoolForgeCapture
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: SD44YHY75B
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PoolForgeCapture:
    type: application
    platform: iOS
    sources:
      - Sources
    # Merged with the generated Info.plist; holds only what INFOPLIST_KEY_
    # settings cannot express. Local networking is for pointing the app at a
    # dev server over LAN HTTP; production traffic is HTTPS and unaffected.
    info:
      path: Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poolforge.capture
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Pool Forge Capture records a short walk around the backyard with the camera so the yard can be rebuilt in 3D."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location finds the property address and aligns the capture path with compass directions."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
  PoolForgeCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poolforge.capture.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PoolForgeCapture
schemes:
  PoolForgeCapture:
    build:
      targets:
        PoolForgeCapture: all
        PoolForgeCaptureTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PoolForgeCaptureTests
